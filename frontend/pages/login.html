<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Đăng nhập tài khoản TLyuN.">
    <title>Đăng nhập | TLyuN</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/pages/auth.css">
    <script src="../assets/js/components.js" defer></script>
    <script src="../assets/js/api.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
  </head>
  <body>
    <div data-component="header"></div>

    <main class="auth-page">
      <section class="auth-card card" aria-labelledby="login-heading">
        <p class="auth-card__eyebrow">TLyuN · Tài khoản</p>
        <h1 id="login-heading">Đăng nhập</h1>
        <p class="auth-card__intro">Đăng nhập để tiếp tục sử dụng dịch vụ TLyuN.</p>
        <div class="auth-message" id="login-error" role="alert" aria-live="assertive"></div>
        <form class="form auth-form" id="login-form" novalidate>
          <div class="form__field">
            <label for="login-identifier">Email hoặc số điện thoại</label>
            <input id="login-identifier" name="identifier" type="text" autocomplete="username" required>
          </div>
          <div class="form__field">
            <label for="login-password">Mật khẩu</label>
            <div class="auth-password">
              <input id="login-password" name="password" type="password" autocomplete="current-password" required>
              <button class="auth-password__toggle" id="toggle-password-visibility" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">
                <svg class="auth-password__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="auth-password__eye-open" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                  <circle class="auth-password__eye-open" cx="12" cy="12" r="3"></circle>
                  <path class="auth-password__eye-closed" d="m3 3 18 18M10.6 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.2-.9"></path>
                  <path class="auth-password__eye-closed" d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>
          <button class="button button--accent auth-form__submit" id="login-submit" type="submit">Đăng nhập</button>
        </form>
        <p class="auth-card__footer">Chưa có tài khoản? <a id="register-link" href="register.html">Đăng ký</a></p>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
