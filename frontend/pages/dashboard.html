<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Khu vực tài khoản TLyuN.">
    <title>Tài khoản | TLyuN</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/pages/auth.css">
    <script src="../assets/js/components.js" defer></script>
    <script src="../assets/js/api.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
  </head>
  <body>
    <div data-component="header"></div>

    <main class="auth-page">
      <section class="auth-card card" aria-labelledby="dashboard-heading" data-auth-dashboard>
        <p class="auth-card__eyebrow">TLyuN · Tài khoản</p>
        <h1 id="dashboard-heading">Khu vực tài khoản</h1>
        <p id="dashboard-status" class="auth-dashboard__status" role="status" aria-live="polite">Đang tải thông tin tài khoản...</p>
        <div id="dashboard-content" hidden>
          <h2 id="dashboard-name"></h2>
          <p>Vai trò: <strong id="dashboard-role"></strong></p>
          <p id="dashboard-role-description" class="auth-card__intro"></p>
          <a class="button button--quiet" href="services.html">Xem dịch vụ</a>
          <nav id="dashboard-admin-tools" aria-label="Công cụ quản trị" hidden>
            <h3>Công cụ quản trị</h3>
            <p><a class="button button--quiet" href="admin-content.html">Chỉnh sửa nội dung trang</a></p>
            <p><a class="button button--quiet" href="admin-collections.html">Quản lý slide, bài viết, đối tác và kho</a></p>
          </nav>
        </div>
        <button class="button button--accent auth-form__submit" id="logout-submit" type="button" disabled>Đăng xuất</button>
      </section>
    </main>

    <div data-component="footer"></div>
  </body>
</html>
